# Network Architecture Parameters
network:
  # input feature dimension
  input_dim: 2
  # latent dimension
  latents_dim: 512
  # output dimension
  output_dim: 32
  # activation function
  activation_function: relu

tdd:
  # discount factor
  tdd_discount: 0.99

# Training Parameters
train:
  # total number of training steps
  total_steps: 5000 # 5000을 권장
  # batch size for training
  batch_size: 1024
  # logging interval
  logging_interval: 100 
  # learning_rate_init
  learning_rate_init: 5e-6
  # learning_rate_final
  learning_rate_final: 1e-7
  # lr_decay_type
  lr_decay_type: cosine
  # grad_norm_decay_type
  grad_norm_decay_type: cosine
  # max_grad_norm_init
  max_grad_norm_init: 0.01
  # max_grad_norm_final
  max_grad_norm_final: 0.001
  # grad_norm_decay_type
  grad_norm_decay_type: cosine
  # coeff stop ratio
  coeff_stop_ratio: 4
  # coeff magnitude
  coeff_magnitude: 1
  # tdd with mean state
  tdd_with_mean_state: True
  # # learning rate
  # learning_rate: 3e-4
  # maximum gradient norm
  # max_grad_norm: 0.5