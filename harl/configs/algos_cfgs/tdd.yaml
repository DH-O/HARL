# Network Architecture Parameters
network:
  # input feature dimension
  input_dim: 2
  # latent dimension
  latents_dim: 128
  # output dimension
  output_dim: 64
  # activation function
  activation_function: relu
  # use independent nets
  use_independent_nets: True
  # use central SD
  use_central_SD: False

tdd:
  # discount factor
  tdd_discount: 0.99

# Training Parameters
train:
  # total number of learning steps of warmup
  warmup_steps: 5000 # 8000을 권장하나 이젠 5000도 되지 않을까 싶다
  # total number of learning steps of learning
  learning_steps: 6000  # 본격적으로 온라인학습할 때 한 번 학습할때마나 learning_steps만큼 도는거다.
  # warmup logging interval
  warmup_logging_interval: 1000
  # learning logging interval
  learning_logging_interval: 1000
  # batch size for training
  batch_size: 1024 # 512가 원래 값
  # coeff stop ratio 클수록 빨리 멈춘다. ex) 1/2 steps에 멈추기. 0으로 설정하면 감소 안 한다.
  coeff_stop_ratio: 1
  # coeff magnitude
  coeff_magnitude: 10
  # learning rate
  learning_rate: 1e-3
  
  # use updated inter-agent intrinsic reward
  use_updated_inter: False
  # coeff for inter-agent intrinsic reward
  coeff_inter_agent_int_rew: 0
  # off the extrinsic reward
  off_extrinsic_reward: False
  # update interval of rollout history
  update_interval_of_rollout_history: 5000 # 3000 * 800 = 2400000 즉 이 숫자만큼 히스토리가 쌓여야 tdd학습이 진행된다.
  # use synthetic data
  use_synthetic_data: False
  # number of trajectories for synthetic data
  n_trajs_for_synthetic_data: 1000
  # use reverse update
  use_reverse_update: False
  # use only one buffer
  use_one_buffer: False
  
  
  # use suppression reward
  use_suppression_reward: False
  # use state entropy
  use_state_entropy: False
  # use actor entropy
  use_actor_entropy: True
  # max historical samples
  max_historical_samples: 5000
  # max batch size
  max_batch_size: 1024
  # default k value
  default_k_value: 11
  # tdd with mean state
  tdd_with_mean_state: False

# Logging Parameters
logging:
  # turn on/off graph logging
  enable_graph_logging: True
  # turn on/off logger logging
  enable_logger_logging: False