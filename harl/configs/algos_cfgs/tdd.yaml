# Network Architecture Parameters
network:
  # input feature dimension
  input_dim: 2
  # latent dimension
  latents_dim: 512
  # output dimension
  output_dim: 32
  # activation function
  activation_function: relu

tdd:
  # discount factor
  tdd_discount: 0.99

# Training Parameters
train:
  # total number of learning steps of warmup
  warmup_steps: 12 # 5000을 권장
  # total number of learning steps of learning
  learning_steps: 12 # 4로 해보자
  # warmup logging interval
  warmup_logging_interval: 1
  # learning logging interval
  learning_logging_interval: 1
  # batch size for training
  batch_size: 512
  # learning_rate_init
  learning_rate_init: 5e-6
  # learning_rate_final
  learning_rate_final: 1e-7
  # lr_decay_type
  lr_decay_type: cosine
  # grad_norm_decay_type
  grad_norm_decay_type: cosine
  # max_grad_norm_init
  max_grad_norm_init: 0.01
  # max_grad_norm_final
  max_grad_norm_final: 0.001
  # grad_norm_decay_type
  grad_norm_decay_type: cosine
  # coeff stop ratio
  coeff_stop_ratio: 1
  # coeff magnitude
  coeff_magnitude: 1
  # tdd with mean state
  tdd_with_mean_state: False
    # learning rate
  learning_rate: 3e-4
  # maximum gradient norm
  max_grad_norm: 5e-1
  # use state entropy
  use_state_entropy: False